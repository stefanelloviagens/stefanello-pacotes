name: Baixar arquivos
on:
  push:
    paths: ["baixar/lista.txt"]
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          i=1
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            curl -sSL -m 60 -o "baixar/$i.jpg" "$u" && echo "$i ok"
            i=$((i+1))
          done < baixar/lista.txt
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add baixar/*.jpg
          git commit -m "arquivos baixados [skip ci]" || echo nada
          git push
